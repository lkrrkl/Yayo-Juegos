<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>YAYO — Juegos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  /* ============ BASE ============ */
  :root{
    --metal-1:#4a4a54;
    --metal-2:#2c2c34;
    --metal-3:#1c1c22;
    --texto:#eef0f6;
    --muted:#a9adba;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body{
    font-family:'Outfit', system-ui, -apple-system, sans-serif;
    color:var(--texto);
    background-color:var(--metal-2);
    background-image:
      radial-gradient(circle at 50% -10%, #5a5a66 0%, transparent 55%),
      radial-gradient(circle at 50% 120%, #15151a 0%, transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--metal-1), var(--metal-2) 55%, var(--metal-3));
    background-attachment:fixed;

    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(12px, 2.5vh, 32px) clamp(12px, 2.5vw, 36px);
    overflow: hidden;
  }

  /* ============ TORNILLOS ============ */
  .screw{
    position:fixed;
    width:clamp(16px, 2vw, 26px);
    height:clamp(16px, 2vw, 26px);
    border-radius:50%;
    z-index:100;
    pointer-events:none;
    background:
      radial-gradient(circle at 32% 28%, #d6d6e0 0%, #9a9aa6 40%, #5c5c68 72%, #38383f 100%);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.75),
      inset 0 -2px 4px rgba(0,0,0,.65),
      0 3px 7px rgba(0,0,0,.6),
      0 0 0 3px rgba(0,0,0,.25);
  }
  .screw::before,
  .screw::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(#26262e, #14141a);
    border-radius:2px;
    box-shadow:
      inset 0 1px 1px rgba(0,0,0,.9),
      0 1px 0 rgba(255,255,255,.28);
  }
  .screw::before{ width:62%; height:16%; }
  .screw::after{ width:16%; height:62%; }

  .screw--tl{ top:clamp(8px,1.5vh,18px); left:clamp(8px,1.5vw,18px);  transform:rotate(12deg); }
  .screw--tr{ top:clamp(8px,1.5vh,18px); right:clamp(8px,1.5vw,18px); transform:rotate(-24deg); }
  .screw--bl{ bottom:clamp(8px,1.5vh,18px); left:clamp(8px,1.5vw,18px);  transform:rotate(38deg); }
  .screw--br{ bottom:clamp(8px,1.5vh,18px); right:clamp(8px,1.5vw,18px); transform:rotate(-8deg); }

  /* ============ CABECERA ============ */
  .cabecera{
    flex: 0 0 auto;
    text-align:center;
    margin-bottom: clamp(8px, 1.8vh, 22px);
    position:relative;
    z-index:1;
  }

  .cabecera h1{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:clamp(1.8rem, 7vw, 4.2rem);
    line-height:.95;
    letter-spacing:.06em;
    background:linear-gradient(180deg, #ffffff 0%, #cfd4e6 45%, #7f879e 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 16px rgba(140,170,255,.35)) drop-shadow(0 4px 0 rgba(0,0,0,.55));
  }

  .cabecera h2{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:clamp(.65rem, 1.8vw, .95rem);
    letter-spacing:.48em;
    text-indent:.48em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:clamp(4px, 1vh, 12px);
    text-shadow:0 1px 0 rgba(0,0,0,.6);
  }

  .cabecera .linea{
    width:clamp(60px, 16vw, 140px);
    height:2.5px;
    margin:clamp(8px, 1.4vh, 16px) auto 0;
    border-radius:99px;
    background:linear-gradient(90deg, transparent, #8fa2ff, #61e8ff, #8fa2ff, transparent);
    box-shadow:0 0 12px rgba(120,180,255,.75);
  }

  /* ============ REJILLA DE JUEGOS (PC: 3 columnas) ============ */
  .juegos{
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));   /* ← 3 columnas en PC */
    grid-template-rows: repeat(2, minmax(0, 1fr));      /* 2 filas (3 + 2) */
    gap: clamp(12px, 2vw, 24px);
    justify-items: center;
    align-items: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* ============ BOTÓN ARCADE ============ */
  .boton{
    --c1:#7a5cff;
    --c2:#3a1fa0;
    --cd:#1d0f5c;
    --glow:rgba(122,92,255,.55);

    position:relative;
    width: auto;
    height: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    min-height: 0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(4px, 1.2vw, 12px);
    padding:clamp(8px, 1.8vw, 18px);
    text-align:center;
    text-decoration:none;
    overflow:hidden;

    border-radius:clamp(12px, 2.4vw, 22px);
    border:2px solid rgba(255,255,255,.22);

    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.28) 0%, transparent 58%),
      linear-gradient(165deg, var(--c1) 0%, var(--c2) 100%);

    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 7px 0 0 var(--cd),
      0 12px 24px rgba(0,0,0,.55),
      0 0 28px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -14px 24px rgba(0,0,0,.4);

    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    animation:entrar .55s cubic-bezier(.2,.8,.3,1) both;
  }

  .boton:nth-child(1){ animation-delay:.05s; }
  .boton:nth-child(2){ animation-delay:.12s; }
  .boton:nth-child(3){ animation-delay:.19s; }
  .boton:nth-child(4){ animation-delay:.26s; }
  .boton:nth-child(5){ animation-delay:.33s; }

  .boton:focus-visible{
    outline:none;
    transform:translateY(-5px);
    filter:saturate(1.15) brightness(1.08);
    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 11px 0 0 var(--cd),
      0 18px 34px rgba(0,0,0,.65),
      0 0 50px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -14px 24px rgba(0,0,0,.4);
  }

  .boton:active{
    transform:translateY(3px) scale(.99);
    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 3px 0 0 var(--cd),
      0 6px 14px rgba(0,0,0,.65),
      0 0 22px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.35),
      inset 0 -10px 18px rgba(0,0,0,.45);
  }

  @media (hover:hover){
    .boton:hover{
      transform:translateY(-5px);
      filter:saturate(1.15) brightness(1.08);
      box-shadow:
        0 0 0 3px rgba(0,0,0,.5),
        0 11px 0 0 var(--cd),
        0 18px 34px rgba(0,0,0,.65),
        0 0 50px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -14px 24px rgba(0,0,0,.4);
    }
    .boton:hover::after{ left:135%; }
  }

  .boton::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-90%;
    width:55%;
    height:220%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    transform:rotate(22deg);
    transition:left .65s ease;
    pointer-events:none;
  }
  .boton:focus-visible::after{ left:135%; }

  .boton::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:inherit;
    border:1px solid rgba(255,255,255,.28);
    box-shadow:inset 0 0 18px rgba(255,255,255,.18);
    pointer-events:none;
  }

  .boton .icono{
    font-size:clamp(1.4rem, 4.2vw, 2.6rem);
    line-height:1;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));
    position:relative;
    z-index:1;
  }

  .boton .nombre{
    position:relative;
    z-index:1;
    font-weight:700;
    font-size:clamp(.72rem, 1.8vw, 1.05rem);
    line-height:1.2;
    letter-spacing:.015em;
    color:#fff;
    text-shadow:
      0 2px 0 rgba(0,0,0,.45),
      0 0 12px rgba(0,0,0,.35);
  }

  .boton .nombre small{
    display:block;
    margin-top:3px;
    font-size:.74em;
    font-weight:500;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:rgba(255,255,255,.85);
  }

  /* ============ COLORES POR JUEGO ============ */
  .boton--ciudad{
    --c1:#7a5cff;
    --c2:#351a95;
    --cd:#1b0d55;
    --glow:rgba(122,92,255,.6);
  }
  .boton--navidad{
    --c1:#ff4d5e;
    --c2:#9c0f2a;
    --cd:#5c0619;
    --glow:rgba(255,77,94,.55);
  }
  .boton--ventas{                 /* Tienda en VERDE */
    --c1:#34d399;
    --c2:#059669;
    --cd:#065f46;
    --glow:rgba(52,211,153,.55);
  }
  .boton--interiores{
    --c1:#2dd4bf;
    --c2:#0f766e;
    --cd:#0a4f4a;
    --glow:rgba(45,212,191,.55);
  }
  .boton--islamonedas{
    --c1:#fbbf24;
    --c2:#b45309;
    --cd:#78350f;
    --glow:rgba(251,191,36,.55);
  }

  @keyframes entrar{
    from{ opacity:0; transform:translateY(20px) scale(.96); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ======================================================
     MÓVIL → se mantiene en 2 columnas
     ====================================================== */
  @media (max-width: 640px){

    body{
      padding: 8px;
    }

    .cabecera{
      margin-bottom: 6px;
    }
    .cabecera h1{ font-size: clamp(1.4rem, 6.8vw, 2rem); }
    .cabecera h2{ font-size: .55rem; letter-spacing: .3em; text-indent: .3em; margin-top: 2px; }
    .cabecera .linea{ width: 40px; height: 2px; margin-top: 4px; }

    .juegos{
      max-width: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));  /* ← 2 columnas en móvil */
      grid-template-rows: repeat(3, minmax(0, 1fr));     /* 3 filas */
      gap: clamp(6px, 1.6vw, 10px);
    }

    .boton{
      border-radius: clamp(11px, 3vw, 16px);
      padding: clamp(6px, 2vw, 11px);
      gap: clamp(2px, .9vw, 6px);

      box-shadow:
        0 0 0 2px rgba(0,0,0,.5),
        0 4px 0 0 var(--cd),
        0 8px 14px rgba(0,0,0,.5),
        0 0 16px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.45),
        inset 0 -9px 16px rgba(0,0,0,.4);
    }

    .boton:active{
      transform: translateY(2px) scale(.99);
      box-shadow:
        0 0 0 2px rgba(0,0,0,.5),
        0 2px 0 0 var(--cd),
        0 4px 9px rgba(0,0,0,.6),
        0 0 14px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.35),
        inset 0 -7px 12px rgba(0,0,0,.45);
    }

    .boton::before{ inset: 4px; }

    .boton .icono{ font-size: clamp(1.15rem, 4.8vw, 1.7rem); }
    .boton .nombre{ font-size: clamp(.65rem, 2.4vw, .85rem); }
    .boton .nombre small{ font-size: .7em; margin-top: 2px; }

    .screw{ width: 17px; height: 17px; }
    .screw--tl{ top: 5px; left: 5px; }
    .screw--tr{ top: 5px; right: 5px; }
    .screw--bl{ bottom: 5px; left: 5px; }
    .screw--br{ bottom: 5px; right: 5px; }
  }

  /* Pantallas muy pequeñas */
  @media (max-width: 380px){
    .boton .icono{ font-size: clamp(1rem, 4.5vw, 1.35rem); }
    .boton .nombre{ font-size: clamp(.6rem, 2.3vw, .78rem); }
    .juegos{ gap: 5px; }
  }

  /* Landscape móvil */
  @media (max-width: 900px) and (max-height: 500px) and (orientation: landscape){
    body{ padding: 4px; }
    .cabecera h1{ font-size: 1.25rem; }
    .cabecera h2{ font-size: .45rem; }
    .cabecera .linea{ display: none; }
    .cabecera{ margin-bottom: 2px; }
    .juegos{
      gap: 5px;
    }
    .boton{
      padding: 4px;
      gap: 1px;
      border-radius: 10px;
    }
    .boton .icono{ font-size: 1rem; }
    .boton .nombre{ font-size: .58rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

<body>

  <span class="screw screw--tl" aria-hidden="true"></span>
  <span class="screw screw--tr" aria-hidden="true"></span>
  <span class="screw screw--bl" aria-hidden="true"></span>
  <span class="screw screw--br" aria-hidden="true"></span>

  <header class="cabecera">
    <h1>YAYO</h1>
    <h2>Juegos</h2>
    <div class="linea"></div>
  </header>

  <main class="juegos">

    <a class="boton boton--ciudad"
       href="https://lkrrkl.github.io/Diorama-Ciudad/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🌃</span>
      <span class="nombre">
        Constructor de Diorama
        <small>Ciudad Nocturna</small>
      </span>
    </a>

    <a class="boton boton--navidad"
       href="https://lkrrkl.github.io/TiendaNavidad/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🎄</span>
      <span class="nombre">
        Mi Tienda Navideña
        <small>Navidad</small>
      </span>
    </a>

    <a class="boton boton--ventas"
       href="https://lkrrkl.github.io/Tienda-juego/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🛒</span>
      <span class="nombre">
        Menú de Ventas
        <small>Tienda</small>
      </span>
    </a>

    <a class="boton boton--interiores"
       href="https://lkrrkl.github.io/Creador-Interiores/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🏠</span>
      <span class="nombre">
        Creador de Interiores
        <small>Diseño de Casas</small>
      </span>
    </a>

    <a class="boton boton--islamonedas"
       href="https://lkrrkl.github.io/Isla-Monedas/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🏝️</span>
      <span class="nombre">
        Isla Monedas
        <small>Aventura</small>
      </span>
    </a>

  </main>

</body>
</html>
