<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>YAYO — Juegos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  /* ============ BASE ============ */
  :root{
    --metal-1:#4a4a54;
    --metal-2:#2c2c34;
    --metal-3:#1c1c22;
    --texto:#eef0f6;
    --muted:#a9adba;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ min-height:100%; }

  body{
    font-family:'Outfit', system-ui, -apple-system, sans-serif;
    color:var(--texto);
    background-color:var(--metal-2);
    background-image:
      radial-gradient(circle at 50% -10%, #5a5a66 0%, transparent 55%),
      radial-gradient(circle at 50% 120%, #15151a 0%, transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--metal-1), var(--metal-2) 55%, var(--metal-3));
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(64px, 9vh, 110px) clamp(14px, 4vw, 48px) clamp(48px, 8vh, 90px);
    overflow-x:hidden;
  }

  /* ============ TORNILLOS ============ */
  .screw{
    position:fixed;
    width:clamp(20px, 2.4vw, 30px);
    height:clamp(20px, 2.4vw, 30px);
    border-radius:50%;
    z-index:100;
    pointer-events:none;
    background:
      radial-gradient(circle at 32% 28%, #d6d6e0 0%, #9a9aa6 40%, #5c5c68 72%, #38383f 100%);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.75),
      inset 0 -2px 4px rgba(0,0,0,.65),
      0 3px 7px rgba(0,0,0,.6),
      0 0 0 3px rgba(0,0,0,.25);
  }
  .screw::before,
  .screw::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(#26262e, #14141a);
    border-radius:2px;
    box-shadow:
      inset 0 1px 1px rgba(0,0,0,.9),
      0 1px 0 rgba(255,255,255,.28);
  }
  .screw::before{ width:62%; height:16%; }
  .screw::after{ width:16%; height:62%; }

  .screw--tl{ top:clamp(12px,2vh,22px); left:clamp(12px,2vw,22px);  transform:rotate(12deg); }
  .screw--tr{ top:clamp(12px,2vh,22px); right:clamp(12px,2vw,22px); transform:rotate(-24deg); }
  .screw--bl{ bottom:clamp(12px,2vh,22px); left:clamp(12px,2vw,22px);  transform:rotate(38deg); }
  .screw--br{ bottom:clamp(12px,2vh,22px); right:clamp(12px,2vw,22px); transform:rotate(-8deg); }

  /* ============ CABECERA ============ */
  .cabecera{
    text-align:center;
    margin-bottom:clamp(36px, 6vh, 70px);
    position:relative;
    z-index:1;
  }

  .cabecera h1{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:clamp(2.7rem, 12vw, 6.5rem);
    line-height:.95;
    letter-spacing:.06em;
    background:linear-gradient(180deg, #ffffff 0%, #cfd4e6 45%, #7f879e 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(140,170,255,.35)) drop-shadow(0 6px 0 rgba(0,0,0,.55));
  }

  .cabecera h2{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:clamp(.8rem, 2.6vw, 1.15rem);
    letter-spacing:.55em;
    text-indent:.55em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:clamp(10px, 2vh, 18px);
    text-shadow:0 1px 0 rgba(0,0,0,.6);
  }

  .cabecera .linea{
    width:clamp(90px, 22vw, 180px);
    height:3px;
    margin:clamp(18px, 3vh, 28px) auto 0;
    border-radius:99px;
    background:linear-gradient(90deg, transparent, #8fa2ff, #61e8ff, #8fa2ff, transparent);
    box-shadow:0 0 14px rgba(120,180,255,.8);
  }

  /* ============ REJILLA DE JUEGOS (2 COLUMNAS) ============ */
  .juegos{
    width:100%;
    max-width:720px;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:clamp(18px, 3vw, 32px);
    justify-items:center;
    position:relative;
    z-index:1;
  }

  /* ============ BOTÓN ARCADE ============ */
  .boton{
    --c1:#7a5cff;
    --c2:#3a1fa0;
    --cd:#1d0f5c;
    --glow:rgba(122,92,255,.55);

    position:relative;
    width:100%;
    max-width:320px;
    aspect-ratio:1 / 1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(8px, 2vw, 16px);
    padding:clamp(12px, 2.8vw, 26px);
    text-align:center;
    text-decoration:none;
    overflow:hidden;

    border-radius:clamp(16px, 3vw, 26px);
    border:2px solid rgba(255,255,255,.22);

    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.28) 0%, transparent 58%),
      linear-gradient(165deg, var(--c1) 0%, var(--c2) 100%);

    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 10px 0 0 var(--cd),
      0 18px 34px rgba(0,0,0,.65),
      0 0 38px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.45),
      inset 0 -20px 34px rgba(0,0,0,.4);

    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    animation:entrar .55s cubic-bezier(.2,.8,.3,1) both;
  }

  .boton:nth-child(1){ animation-delay:.05s; }
  .boton:nth-child(2){ animation-delay:.15s; }
  .boton:nth-child(3){ animation-delay:.25s; }
  .boton:nth-child(4){ animation-delay:.35s; }
  .boton:nth-child(5){ animation-delay:.45s; }

  .boton:focus-visible{
    outline:none;
    transform:translateY(-7px);
    filter:saturate(1.15) brightness(1.08);
    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 15px 0 0 var(--cd),
      0 26px 46px rgba(0,0,0,.7),
      0 0 70px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -20px 34px rgba(0,0,0,.4);
  }

  .boton:active{
    transform:translateY(4px) scale(.99);
    box-shadow:
      0 0 0 3px rgba(0,0,0,.5),
      0 3px 0 0 var(--cd),
      0 8px 18px rgba(0,0,0,.7),
      0 0 30px var(--glow),
      inset 0 2px 0 rgba(255,255,255,.35),
      inset 0 -14px 26px rgba(0,0,0,.45);
  }

  @media (hover:hover){
    .boton:hover{
      transform:translateY(-7px);
      filter:saturate(1.15) brightness(1.08);
      box-shadow:
        0 0 0 3px rgba(0,0,0,.5),
        0 15px 0 0 var(--cd),
        0 26px 46px rgba(0,0,0,.7),
        0 0 70px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -20px 34px rgba(0,0,0,.4);
    }
    .boton:hover::after{ left:135%; }
  }

  .boton::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-90%;
    width:55%;
    height:220%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    transform:rotate(22deg);
    transition:left .65s ease;
    pointer-events:none;
  }
  .boton:focus-visible::after{ left:135%; }

  .boton::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:inherit;
    border:1px solid rgba(255,255,255,.28);
    box-shadow:inset 0 0 22px rgba(255,255,255,.18);
    pointer-events:none;
  }

  .boton .icono{
    font-size:clamp(2rem, 6.5vw, 3.2rem);
    line-height:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
    position:relative;
    z-index:1;
  }

  .boton .nombre{
    position:relative;
    z-index:1;
    font-weight:700;
    font-size:clamp(.9rem, 2.4vw, 1.25rem);
    line-height:1.2;
    letter-spacing:.015em;
    color:#fff;
    text-shadow:
      0 2px 0 rgba(0,0,0,.45),
      0 0 16px rgba(0,0,0,.35);
  }

  .boton .nombre small{
    display:block;
    margin-top:5px;
    font-size:.76em;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:rgba(255,255,255,.85);
  }

  /* ============ COLORES POR JUEGO ============ */
  .boton--ciudad{
    --c1:#7a5cff;
    --c2:#351a95;
    --cd:#1b0d55;
    --glow:rgba(122,92,255,.6);
  }
  .boton--navidad{
    --c1:#ff4d5e;
    --c2:#9c0f2a;
    --cd:#5c0619;
    --glow:rgba(255,77,94,.55);
  }
  .boton--ventas{
    --c1:#ffb02e;
    --c2:#c25e00;
    --cd:#7a3900;
    --glow:rgba(255,176,46,.55);
  }
  .boton--interiores{
    --c1:#2dd4bf;
    --c2:#0f766e;
    --cd:#0a4f4a;
    --glow:rgba(45,212,191,.55);
  }
  .boton--islamonedas{
    --c1:#fbbf24;
    --c2:#b45309;
    --cd:#78350f;
    --glow:rgba(251,191,36,.55);
  }

  @keyframes entrar{
    from{ opacity:0; transform:translateY(26px) scale(.96); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ======================================================
     MÓVIL: 2 COLUMNAS (ajustadas a la pantalla, sin scroll)
     ====================================================== */
  @media (max-width: 640px){

    html, body{
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body{
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .cabecera{
      flex: 0 0 auto;
      margin-bottom: 6px;
    }
    .cabecera h1{ font-size: clamp(1.5rem, 7.5vw, 2.2rem); line-height:.95; }
    .cabecera h2{ font-size: .6rem; letter-spacing: .35em; text-indent: .35em; margin-top: 3px; }
    .cabecera .linea{ width: 46px; height: 2px; margin-top: 4px; }

    .juegos{
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(8px, 2vw, 14px);
      width: 100%;
      max-width: none;
      overflow: hidden;
      align-content: center;
      justify-items: center;
    }

    .boton{
      width: 100%;
      max-width: none;
      height: auto;
      aspect-ratio: 1 / 1;
      min-height: 0;
      margin: 0;

      border-radius: clamp(12px, 3.5vw, 18px);
      padding: clamp(8px, 2.5vw, 14px);
      gap: clamp(3px, 1.2vw, 8px);

      box-shadow:
        0 0 0 2px rgba(0,0,0,.5),
        0 5px 0 0 var(--cd),
        0 10px 18px rgba(0,0,0,.6),
        0 0 20px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.45),
        inset 0 -12px 20px rgba(0,0,0,.4);
    }

    .boton:active{
      transform: translateY(3px) scale(.99);
      box-shadow:
        0 0 0 2px rgba(0,0,0,.5),
        0 2px 0 0 var(--cd),
        0 5px 12px rgba(0,0,0,.7),
        0 0 18px var(--glow),
        inset 0 2px 0 rgba(255,255,255,.35),
        inset 0 -8px 16px rgba(0,0,0,.45);
    }

    .boton::before{ inset: 4px; }

    .boton .icono{ font-size: clamp(1.25rem, 5.5vw, 1.9rem); }
    .boton .nombre{ font-size: clamp(.7rem, 2.8vw, .95rem); line-height: 1.15; }
    .boton .nombre small{ font-size: .7em; margin-top: 2px; letter-spacing: .04em; }

    .screw{ width: 20px; height: 20px; }
    .screw--tl{ top: 6px; left: 6px; }
    .screw--tr{ top: 6px; right: 6px; }
    .screw--bl{ bottom: 6px; left: 6px; }
    .screw--br{ bottom: 6px; right: 6px; }
  }

  /* Pantallas muy pequeñas */
  @media (max-width: 380px){
    .boton .icono{ font-size: clamp(1.1rem, 5vw, 1.5rem); }
    .boton .nombre{ font-size: clamp(.65rem, 2.6vw, .85rem); }
    .juegos{ gap: 6px; }
  }

  /* Landscape móvil: también 2 columnas */
  @media (max-width: 900px) and (max-height: 500px) and (orientation: landscape){
    html, body{ height: 100%; overflow: hidden; }
    body{
      height: 100dvh;
      padding: 6px;
    }
    .cabecera h1{ font-size: 1.35rem; }
    .cabecera h2{ font-size: .5rem; }
    .cabecera .linea{ display: none; }
    .cabecera{ margin-bottom: 4px; }
    .juegos{
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      align-content: center;
    }
    .boton{
      aspect-ratio: 1 / 1;
      padding: 6px;
      gap: 2px;
    }
    .boton .icono{ font-size: 1.1rem; }
    .boton .nombre{ font-size: .65rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

<body>

  <span class="screw screw--tl" aria-hidden="true"></span>
  <span class="screw screw--tr" aria-hidden="true"></span>
  <span class="screw screw--bl" aria-hidden="true"></span>
  <span class="screw screw--br" aria-hidden="true"></span>

  <header class="cabecera">
    <h1>YAYO</h1>
    <h2>Juegos</h2>
    <div class="linea"></div>
  </header>

  <main class="juegos">

    <a class="boton boton--ciudad"
       href="https://lkrrkl.github.io/Diorama-Ciudad/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🌃</span>
      <span class="nombre">
        Constructor de Diorama
        <small>Ciudad Nocturna</small>
      </span>
    </a>

    <a class="boton boton--navidad"
       href="https://lkrrkl.github.io/TiendaNavidad/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🎄</span>
      <span class="nombre">
        Mi Tienda Navideña
        <small>Navidad</small>
      </span>
    </a>

    <a class="boton boton--ventas"
       href="https://lkrrkl.github.io/Tienda-juego/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🛒</span>
      <span class="nombre">
        Menú de Ventas
        <small>Tienda</small>
      </span>
    </a>

    <a class="boton boton--interiores"
       href="https://lkrrkl.github.io/Creador-Interiores/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🏠</span>
      <span class="nombre">
        Creador de Interiores
        <small>Diseño de Casas</small>
      </span>
    </a>

    <a class="boton boton--islamonedas"
       href="https://lkrrkl.github.io/Isla-Monedas/"
       target="_blank" rel="noopener noreferrer">
      <span class="icono">🏝️</span>
      <span class="nombre">
        Isla Monedas
        <small>Aventura de Dinero</small>
      </span>
    </a>

  </main>

</body>
</html>
